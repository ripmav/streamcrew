# sqlc generates typed Go code for the SQL in internal/store (Code-ADR-0008).
# Regenerate with: go generate ./internal/store/...
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: sqlcgen
        out: internal/store/sqlcgen
        emit_empty_slices: true
