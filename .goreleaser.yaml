# SPDX-License-Identifier: MIT
#
# goreleaser configuration of the streamcrew core release (ADR-0025).
#
# The release.yml workflow runs "goreleaser release" on tags v*.*.*: the
# binaries for all target platforms, the checksums, the CycloneDX SBOM, the
# systemd unit examples and the module source archive (built by the
# workflow before goreleaser runs and included via extra_files). The
# container image is built and uploaded by the workflow, because
# goreleaser cannot produce a portable multi-platform image tar here.
version: 2

project_name: streamcrew

builds:
  - id: streamcrew
    main: ./cmd/streamcrew
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  # The desktop variant with the tag localaudio (ADR-0020 §1): the local
  # sink plays the sound on the audio device of the host. oto/v3 is pure
  # Go (purego), so it cross-compiles with CGO_ENABLED=0 like the core.
  # The local playback itself is not verified by the CI (no audio device
  # on the runners).
  - id: streamcrew-desktop
    main: ./cmd/streamcrew
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -tags=localaudio
    ldflags:
      - -s -w

archives:
  - id: streamcrew
    ids: [streamcrew]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
  # The desktop archives are named after their build, so they do not
  # collide with the core archives of the same version and platform.
  - id: streamcrew-desktop
    ids: [streamcrew-desktop]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "streamcrew-desktop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  # The extra release files get their checksums too (C11 of the code
  # review 2026-10-26); the image artifacts are appended by the workflow.
  extra_files:
    - glob: packaging/systemd/streamcrew.service
    - glob: packaging/systemd/streamcrew.env.example
    - glob: "module-src/streamcrew-{{ .Version }}-src.zip"
      name_template: "streamcrew-{{ .Version }}-src.zip"

# goreleaser v2: the SBOM is generated by a command (default syft) instead
# of the v1 built-in sbom section; cyclonedx instead of the spdx default
sboms:
  - cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
    artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: ripmav
    name: streamcrew
  mode: replace
  # tags with a prerelease part (e.g. v0.0.0-alpha1) are GitHub
  # prereleases, not "Latest" releases
  prerelease: auto
  # goreleaser v2: extra release assets are globs under release
  extra_files:
    - glob: packaging/systemd/streamcrew.service
    - glob: packaging/systemd/streamcrew.env.example
    # built by the workflow into module-src/ (goreleaser's --clean wipes
    # dist/, so the pre-built input lives outside it)
    - glob: "module-src/streamcrew-{{ .Version }}-src.zip"
      name_template: "streamcrew-{{ .Version }}-src.zip"
