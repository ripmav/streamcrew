# SPDX-License-Identifier: MIT
#
# buf module and checks for the API contract (ADR-0010, Code-ADR-0016).
# The protobuf files in api/proto are the single source of the contract;
# buf lints them, checks breaking changes and drives code generation
# (buf.gen.yaml). Generated Go code is checked in under api/gen.
version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  except:
    # The contract is one package (streamcrew.v1alpha1) for every service
    # (ADR-0010), so the strict per-method names would collide ("ListRequest"
    # in several services). We use descriptive, package-unique request and
    # response names instead (e.g. ListCommandsRequest, ListUsersRequest),
    # and the server stream item is a meaningful type name (Event).
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
