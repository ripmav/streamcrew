# SPDX-License-Identifier: Apache-2.0
#
# Weekly dependency updates (Code-ADR-0001). Updates are grouped per ecosystem,
# so each week brings at most one pull request per ecosystem. The go directive
# in go.mod is not covered and is raised by hand with each Go release.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
