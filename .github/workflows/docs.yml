# SPDX-License-Identifier: MIT
#
# Link check for the Markdown documentation (Roadmap Phase 1.1, Code-ADR-0001).
# Checks only links inside the repository (files and heading anchors), so that
# references between plan, roadmap, ADRs and specs never point into the void.
# External links are not checked: they need network access and fail randomly.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Internal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
